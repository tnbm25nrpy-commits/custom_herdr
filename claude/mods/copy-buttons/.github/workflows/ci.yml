# The checks at the Claude Code version in .github/claude-code-version, so a
# new Claude Code turns no pull request red: claude-code-watch.yml checks
# each new one. macOS and Windows on a release's tag, or when run by hand.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      platforms: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
